[build-system]
requires = ["setuptools~=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "nvdaL10n"
dynamic = ["version"]
description = "Utilities for translations in NVDA and the add-on template"
maintainers = [
	{name = "NV Access", email = "info@nvaccess.org"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "license"}
dependencies = [
	"pyinstaller==6.19.0",
	"crowdin-api-client==1.28.0",
	"l2m4m==1.0.4",
	"lxml==6.1.2",
	"markdown==3.10.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
	"mdx-truly-sane-lists==1.3",
	"nh3==0.3.6",
	"pymdown-extensions==11.0.1",
	"pyphen==0.18.1",
	"requests==2.34.2",
]
[project.urls]
Repository = "https://github.com/nvaccess/nvdaL10n"

[dependency-groups]
dev = [
	"ruff==0.16.3",
	"prek==0.4.14",
	"ty==0.0.73",
]

[tool.setuptools.packages.find]
where = ["source"]

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ty.environment]
python = ".venv"
python-platform = "win32"
# Tell ty where to load python code from (ported from pyright's extraPaths).
extra-paths = [
	"./source",
]

[tool.ty.src]
# Appended to ty's default excludes (which already cover e.g. .git, .venv and __pycache__ at any depth).
# Patterns are anchored to the project root.
exclude = [
	"build",
	"dist",
	"./miscDeps",
]

[tool.ty.terminal]
output-format = "concise"

[tool.ty.rules]
unresolved-attribute = "ignore"  # 3 errors
not-subscriptable = "ignore"  # 3 errors
invalid-argument-type = "ignore"  # 7 errors
invalid-assignment = "ignore"  # 3 errors
unsupported-operator = "ignore"  # 3 errors
invalid-return-type = "ignore"  # 1 error
unresolved-import = "ignore"  # 3 errors
# Non-fatal warnings
deprecated = "ignore"  # 3 warnings
